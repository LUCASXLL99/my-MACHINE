[package]
name = "meu-projeto"
version = "0.1.0"
edition = "2024"  # Estável desde Rust 1.85 — traz melhorias de ergonomia e lifetimes

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

# ARMADILHA 6 (CORRIGIDA): web-sys só expõe métodos das features explicitamente
# declaradas. Cada API do browser precisa de uma feature correspondente.
# Adicione as features que o seu projeto usa. Referência completa:
# https://rustwasm.github.io/wasm-bindgen/api/web_sys/
[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Node",
  "console",
  # Descomente conforme necessidade:
  # "Crypto",          # window.crypto()
  # "SubtleCrypto",    # operações criptográficas assíncronas
  # "DomTokenList",    # element.class_list()
  # "EventTarget",     # addEventListener
  # "Event",
  # "MouseEvent",
  # "KeyboardEvent",
  # "HtmlCanvasElement",
  # "CanvasRenderingContext2d",
  # "Storage",         # localStorage / sessionStorage
  # "Performance",     # window.performance
  # "Navigator",       # window.navigator
  # "Location",        # window.location
]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Reduz tamanho do binário e remove info de debug (segurança em produção)
opt-level     = "s"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = "symbols"

# ARMADILHA 2 (CORRIGIDA): incompatibilidade entre binaryen do nixpkgs e o
# .wasm gerado. Se wasm-pack falhar com "Fatal: error validating input",
# mantenha wasm-opt = false aqui. O binário funciona normalmente, só sem
# a otimização de tamanho final do wasm-opt.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
