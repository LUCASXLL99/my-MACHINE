<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Projeto WASM</title>

  <!--
    ARMADILHA 3 (CORRIGIDA): scripts inline bloqueados por CSP.

    Se este HTML tiver <script> inline, a CSP via <meta> vai bloqueá-los
    a menos que você adicione o hash SHA-256 de cada um na diretiva script-src.

    COMO OBTER OS HASHES:
      1. Abra o projeto no browser (python3 -m http.server 8080)
      2. Abra o console (F12)
      3. Copie os hashes que aparecem no erro, ex:
         "sha256-abc123...=" — e cole abaixo substituindo os placeholders.

    ARMADILHA 4 (CORRIGIDA): 'frame-ancestors' é IGNORADO via <meta>.
      Funciona APENAS via HTTP header (nginx/caddy). Não coloque aqui.
      A proteção anti-clickjacking já é feita pelo script inline abaixo.

    ATENÇÃO: os hashes abaixo são PLACEHOLDER — substitua pelos reais
    após rodar o projeto e copiar do console do browser.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src  'self' 'wasm-unsafe-eval'
                'sha256-SUBSTITUA_PELO_HASH_REAL_1='
                'sha256-SUBSTITUA_PELO_HASH_REAL_2=';
    style-src   'self' 'unsafe-inline';
    connect-src 'self';
    img-src     'self' data:;
    object-src  'none';
    base-uri    'self';
  ">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!--
    Proteção anti-clickjacking via script (substitui frame-ancestors no <meta>).
    Adicione o hash deste script na CSP acima após ver o erro no console.
  -->
  <script>
    if (window.top !== window.self) {
      window.top.location = window.self.location;
    }
  </script>

  <div id="app"></div>

  <!--
    Loader do WASM — mova para arquivo .js externo se quiser evitar
    ter que calcular o hash deste script inline.
    Arquivo externo: <script type="module" src="bootstrap.js"></script>
  -->
  <script type="module">
    import init from "./pkg/meu_projeto.js";
    await init();
  </script>

</body>
</html>
