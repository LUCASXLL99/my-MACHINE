[prefs]
summary = true
wrap    = false

[jobs.check]
command          = ["cargo", "check", "--message-format=short"]
need_stdout      = false
default_watch    = true

[jobs.build]
command     = ["cargo", "build", "--message-format=short"]
need_stdout = false

[jobs.clippy]
command     = ["cargo", "clippy", "--message-format=short", "--", "-D", "warnings"]
need_stdout = false

[jobs.test]
command     = ["cargo", "test", "--message-format=short"]
need_stdout = true

[jobs.run]
command          = ["cargo", "run"]
need_stdout      = true
allow_warnings   = true

[jobs.doc]
command     = ["cargo", "doc", "--no-deps"]
need_stdout = false

[keybindings]
k = "job:check"
b = "job:build"
c = "job:clippy"
t = "job:test"
r = "job:run"
d = "job:doc"
