[package]
name    = "meu-projeto"
version = "0.1.0"
edition = "2021"

[dependencies]

[profile.dev]
debug       = 1        # line tables apenas — link 2x mais rápido que debug=2
incremental = true

[profile.dev.package."*"]
opt-level = 3          # deps otimizadas — proc-macros e serde rodam rápido

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = "symbols"
