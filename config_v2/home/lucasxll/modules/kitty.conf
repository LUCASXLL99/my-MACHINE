# ~/.config/kitty/kitty.conf
# Kitty adaptado para canhoto + tela espelhada

# ── Fonte ────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
font_size        12.0

# ── Abas à direita (visualmente à esquerda com tela espelhada)
tab_bar_edge          top
tab_bar_align         right
tab_bar_style         powerline
tab_powerline_style   slanted

# Scrollbar (kitty não tem scrollbar nativa, usa scroll overlay)
scrollback_lines  5000

# ── Layout para canhoto ──────────────────────────────────────
# Padding maior à direita para o scrollback indicator
window_padding_width 4 12 4 4

# ── Atalhos para canhoto (RAlt + tecla) ──────────────────────
# Remove atalhos padrão que conflitam
clear_all_shortcuts no

# Nova aba
map ralt+t new_tab_with_cwd
# Fechar aba
map ralt+w close_tab
# Próxima/anterior aba
map ralt+n next_tab
map ralt+p previous_tab
# Split
map ralt+s launch --location=hsplit
map ralt+d launch --location=vsplit
# Navegar painéis
map ralt+h neighboring_window left
map ralt+l neighboring_window right
map ralt+k neighboring_window up
map ralt+j neighboring_window down
# Copiar/colar
map ralt+c copy_to_clipboard
map ralt+v paste_from_clipboard
# Zoom
map ralt+z toggle_layout stack

# ── Cores (mesma paleta do polybar/dunst) ────────────────────
background            #0e1117
foreground            #e6edf3
selection_background  #58a6ff
selection_foreground  #0e1117
cursor                #58a6ff

# Cores das abas
active_tab_background   #58a6ff
active_tab_foreground   #0e1117
active_tab_font_style   bold
inactive_tab_background #161b22
inactive_tab_foreground #8b949e

# ── Janela ───────────────────────────────────────────────────
background_opacity 0.95
hide_window_decorations yes
